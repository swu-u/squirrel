<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { setupEnvironment, PALETTE } from '../src/world/env.js';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(6, 3, 8); camera.lookAt(0, 1, 0);
const env = setupEnvironment(scene, renderer);
const g = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color: PALETTE.grass, roughness: 1}));
g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
const b = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshStandardMaterial({color: 0xb5654a, roughness: .8}));
b.position.y = 1; b.castShadow = true; b.receiveShadow = true; scene.add(b);
const s = new THREE.Mesh(new THREE.SphereGeometry(.8, 32, 16), new THREE.MeshStandardMaterial({color: 0xffffff, roughness: .3}));
s.position.set(-2.5,.8,1); s.castShadow = true; scene.add(s);
renderer.setAnimationLoop((t)=>{ env.update(new THREE.Vector3(), t/1000); renderer.render(scene, camera); });
</script></body></html>
