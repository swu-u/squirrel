<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>Squirrel: input and interface viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c120a; }
  #game { position: fixed; inset: 0; height: 100dvh; overflow: hidden; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #readout {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4;
    font: 11px/1.45 ui-monospace, Menlo, monospace; color: #fff6e4; white-space: pre;
    background: rgba(30, 16, 8, .5); padding: 6px 10px; border-radius: 8px; pointer-events: none;
  }
</style>
</head>
<body>
<div id="game"><canvas id="bg"></canvas><div id="readout"></div></div>
<script type="module">
import { createInput } from '../src/core/input.js';
import { createHUD } from '../src/ui/hud.js';

const params = new URLSearchParams(location.search);
const game = document.getElementById('game');
const cv = document.getElementById('bg');
const ctx = cv.getContext('2d');
const readout = document.getElementById('readout');
if (params.get('clean') === '1') readout.style.display = 'none';

const input = createInput(game);
if (params.get('touch') === '1') {   // force the touch controls on a desktop browser
  game.dispatchEvent(new PointerEvent('pointerdown', { pointerType: 'touch', pointerId: 99, bubbles: true, clientX: innerWidth * 0.7, clientY: 10 }));
  window.dispatchEvent(new PointerEvent('pointerup', { pointerType: 'touch', pointerId: 99, bubbles: true }));
}
const hud = createHUD(game, input);
hud.onSettingsChange((s, key) => console.log('[settings]', key, JSON.stringify(s)));

// ---- fake game picture: bright sky above, dark foliage below, things moving ----
let camX = 0, camY = 0, px = 0, py = 0, t = 0;
function resize() { const d = Math.min(2, devicePixelRatio); cv.width = innerWidth * d; cv.height = innerHeight * d; }
addEventListener('resize', resize); resize();
function draw() {
  const w = cv.width, h = cv.height;
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#8fc7ea'); sky.addColorStop(0.42, '#ffe2a8'); sky.addColorStop(0.6, '#f2a45a'); sky.addColorStop(1, '#27401f');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(255,244,200,.9)'; ctx.beginPath(); ctx.arc(w * 0.72 - camX * 0.2, h * 0.3 + camY * 0.2, h * 0.09, 0, 7); ctx.fill();
  const cols = ['#c9541f', '#e08a1e', '#7d9a2e', '#2f5a26', '#1d3b1c', '#b03a1a'];
  for (let i = 0; i < 26; i++) {
    const layer = (i % 3) + 1;
    const x = ((i * 173.3 - camX * layer * 0.6 + Math.sin(t * 0.3 + i) * 20) % (w + 400) + w + 400) % (w + 400) - 200;
    const y = h * (0.55 + (i % 5) * 0.11) + camY * layer * 0.3 + Math.cos(t * 0.5 + i * 2) * 8;
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath(); ctx.arc(x, y, h * (0.12 + (i % 4) * 0.04), 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#c96f2a';
  ctx.beginPath(); ctx.ellipse(w / 2 + px, h * 0.58 - py, h * 0.045, h * 0.03, 0, 0, 7); ctx.fill();
}

// ---- states ----
const QUESTS = [
  { title: 'Stock the nest', text: 'Bring acorns back to the old oak', progress: 2, total: 5 },
  { title: 'The golden acorn', text: 'It glints on the clock tower roof', progress: 0, total: 1 },
];
let demo = false, paused = false;
const debug = {
  input, hud,
  title(hasSave) { demo = false; hud.setVisible(false); hud.showTitle({ hasSave: !!hasSave, onStart: () => { hud.hideTitle(); debug.play(); } }); },
  howto() { hud.showHowTo(); },
  play() {
    hud.hideTitle(); hud.setVisible(true); demo = true;
    hud.setHealth(2, 3); hud.setAcorns(12); hud.setGolden(1, 5);
    hud.setBurst(0.72); hud.setCombo(4, 0.7); hud.setQuest(QUESTS[0]);
    hud.setDogAlert(0.4);
    hud.setWaypoint({ visible: true, onScreen: true, x: innerWidth * 0.63, y: innerHeight * 0.44, distance: 24, label: 'Nest' });
    hud.setTargetReticle({ visible: true, x: innerWidth * 0.36, y: innerHeight * 0.6, kind: 'dog' });
  },
  full() { debug.play(); hud.setHealth(5, 5); hud.setAcorns(128); hud.setGolden(5, 5); hud.setBurst(1); hud.setCombo(7, 0.9); hud.setDogAlert(1);
    hud.setWaypoint({ visible: true, onScreen: false, angle: -0.5, distance: 112, label: 'Clock tower' }); },
  quest() { hud.setQuest(QUESTS[1]); },
  questStep() { QUESTS[0].progress = Math.min(5, QUESTS[0].progress + 1); hud.setQuest(QUESTS[0]); },
  complete() { hud.questComplete('Stock the nest'); },
  toast(text) { hud.toast(text || 'Acorns are safe in the nest'); },
  acorn() { hud.setAcorns(13); },
  damage() { hud.setHealth(1, 3); hud.flashDamage(); },
  pause() { paused = true; hud.showPause({ onResume: () => { paused = false; }, onRestart: () => { paused = false; debug.play(); } }); },
  settings() { hud.showSettings(); },
  ending() { hud.showEnding({ acorns: 148, golden: 4, goldenTotal: 5, time: 754, dogs: 6 }, () => {}); },
  respawn() { return hud.showRespawn(() => hud.setHealth(3, 3)); },
  waypointOff(angle) { hud.setWaypoint({ visible: true, onScreen: false, angle: angle == null ? 0.6 : angle, distance: 86, label: 'Nest' }); },
  alert(v) { hud.setDogAlert(v); },
  disable() { input.setEnabled(false); }, enable() { input.setEnabled(true); },
  snapshot() {
    const l = input.consumeLook();
    return { move: { x: +input.move.x.toFixed(3), y: +input.move.y.toFixed(3) }, look: { dx: l.dx, dy: l.dy },
      jumpPressed: input.jumpPressed, jumpHeld: input.jumpHeld, attackPressed: input.attackPressed, attackHeld: input.attackHeld,
      lookActive: input.lookActive, isTouch: input.isTouch };
  },
  // Three fingers at once: stick, camera drag, Jump held. The frame loop is paused so nothing is consumed in between.
  async multiTouch() {
    frozen = true;
    const out = {};
    const fire = (type, id, x, y, target) => (target || document.elementFromPoint(x, y) || game).dispatchEvent(
      new PointerEvent(type, { pointerType: 'touch', pointerId: id, clientX: x, clientY: y, bubbles: true, cancelable: true, isPrimary: id === 1 }));
    const W = innerWidth, H = innerHeight;
    const jb = document.querySelector('.sq-btn-jump').getBoundingClientRect();
    const jx = jb.left + jb.width / 2, jy = jb.top + jb.height / 2;
    input.consumeLook(); input.endFrame();
    fire('pointerdown', 1, W * 0.2, H * 0.6);                  // left thumb lands
    fire('pointermove', 1, W * 0.2 + 30, H * 0.6 - 40, window); // pushes up and right
    out.a_stickOnly = debug.snapshot();
    fire('pointerdown', 2, W * 0.6, H * 0.4);                  // second finger drags the camera
    fire('pointermove', 2, W * 0.6 + 25, H * 0.4 + 10, window);
    out.b_stickAndLook = debug.snapshot();
    fire('pointerdown', 3, jx, jy);                            // third finger holds Jump
    out.c_jumpDown = debug.snapshot();
    input.endFrame();
    fire('pointermove', 3, jx - 120, jy - 90, window);         // sliding off the button must not move the camera
    fire('pointermove', 2, W * 0.6 + 45, H * 0.4 + 10, window);
    fire('pointermove', 1, W * 0.2 - 200, H * 0.6, window);    // dragged far left: the ring follows
    out.d_nextFrameAllThree = debug.snapshot();
    fire('pointerup', 1, 0, 0, window);
    out.e_stickReleased = debug.snapshot();
    fire('pointerup', 2, 0, 0, window);
    fire('pointerup', 3, 0, 0, window);
    out.f_allReleased = debug.snapshot();
    frozen = false;
    return out;
  },
};
window.debug = debug;

let frozen = false, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  if (!frozen) {
    const look = input.consumeLook();
    const s = hud.settings.sensitivity;
    camX += look.dx * s; camY += look.dy * s * (hud.settings.invertY ? -1 : 1);
    px += input.move.x * 260 * dt; py += input.move.y * 160 * dt;
    if (input.pausePressed) { if (!paused && !hud.modalOpen) debug.pause(); }
    if (demo && !paused) {
      const st = Math.hypot(input.move.x, input.move.y) < 0.05;
      debug._burst = Math.min(1, Math.max(0, (debug._burst ?? 0.72) + (st ? dt * 0.4 : -dt * 1.5)));
      hud.setBurst(debug._burst);
    }
    readout.textContent =
      `move  x ${input.move.x.toFixed(2).padStart(5)}  y ${input.move.y.toFixed(2).padStart(5)}\n` +
      `look  dx ${String(Math.round(look.dx)).padStart(4)}  dy ${String(Math.round(look.dy)).padStart(4)}  active ${input.lookActive ? 'yes' : 'no'}\n` +
      `jump  ${input.jumpHeld ? 'held' : '-   '}   attack ${input.attackHeld ? 'held' : '-   '}\n` +
      `touch ${input.isTouch ? 'yes' : 'no'}  locked ${input.pointerLocked ? 'yes' : 'no'}  enabled ${input.enabled ? 'yes' : 'no'}`;
    hud.update(dt);
    input.endFrame();
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const state = params.get('state') || 'title';
if (typeof debug[state] === 'function') {
  if (['howto', 'settings', 'ending', 'pause', 'damage', 'quest', 'complete', 'toast', 'full'].includes(state) && state !== 'full') debug.play();
  debug[state]();
}
</script>
</body>
</html>
