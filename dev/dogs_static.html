<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';
import { setupEnvironment, PALETTE } from '../src/world/env.js';
import { buildDog } from '../src/entities/dog/build.js';
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.05, 500);
const env = setupEnvironment(scene, renderer);
const g = new THREE.Mesh(new THREE.PlaneGeometry(400,400), new THREE.MeshStandardMaterial({color: PALETTE.grass, roughness: 1}));
g.rotation.x = -Math.PI/2; g.receiveShadow = true; scene.add(g);
const kinds = (q.get('kind') || 'terrier,shepherd,bulldog').split(',');
let x = -(kinds.length-1)*0.9; const info = {};
for (const k of kinds) { const d = buildDog(k); const grp = new THREE.Group(); grp.add(d.mesh); for (const b of d.boneList) grp.add(b); d.mesh.bind(d.skeleton, new THREE.Matrix4()); grp.position.x = x; grp.rotation.y = +(q.get('yaw')||0.6); x += 1.8; scene.add(grp); info[k] = d.triCount; }
const sq = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.32, 4, 12), new THREE.MeshStandardMaterial({color: 0xb5562a})); sq.rotation.x = Math.PI/2; sq.position.set(x - 0.6, 0.12, 0.8); sq.castShadow = true; scene.add(sq);
const cd = +(q.get('dist')||5.5), ch = +(q.get('h')||1.1), ca = +(q.get('ang')||0);
const tx = +(q.get('tx')||0), ty = +(q.get('ty')||0.6);
camera.position.set(tx + Math.sin(ca)*cd, ch, Math.cos(ca)*cd); camera.lookAt(tx, ty, 0);
window.info = info;
renderer.setAnimationLoop((t)=>{ env.update(new THREE.Vector3(), t/1000); renderer.render(scene, camera); });
</script></body></html>
